name: Create Keystore
on: workflow_dispatch
jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - name: Generate keystore
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          keytool -genkeypair -storetype PKCS12 -keystore upload-keystore.jks -alias "$KS_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 -storepass "$KS_PASS" -keypass "$KS_PASS" -dname "CN=Sam AI"
          base64 -w 0 upload-keystore.jks > keystore-base64.txt
      - uses: actions/upload-artifact@v4
        with:
          name: keystore
          path: |
            upload-keystore.jks
            keystore-base64.txt
          retention-days: 1
