
name: Build APK et AAB Release signes

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android Release
    runs-on: ubuntu-latest

    steps:
      # 1. Recuperer le projet
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Installer Java 17
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Installer Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current

      # 4. Verifier les secrets obligatoires
      - name: Verifier la configuration Release
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Secret $name manquant."
              exit 1
            fi
          done

          echo "Configuration Release presente."

      # 5. Decoder le vrai Release Key
      - name: Installer le Release Key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          mkdir -p app

          printf '%s' "$KEYSTORE_BASE64" \
            | base64 --decode > app/release.jks

          if [ ! -s app/release.jks ]; then
            echo "::error::Le Release Key est vide."
            exit 1
          fi

          echo "Release Key installe."

      # 6. Verifier le keystore et son alias
      - name: Valider le Release Key
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail

          keytool -list \
            -keystore app/release.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            > /dev/null

          ENTRY=$(keytool -list -v \
            -keystore app/release.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" 2>&1)

          if ! grep -q "PrivateKeyEntry" <<< "$ENTRY"; then
            echo "::error::L'alias ne contient pas de cle privee."
            exit 1
          fi

          echo "Release Key valide."
          echo "Alias Release verifie."

      # 7. Generer APK et AAB avec le Release Key
      - name: Generer APK et AAB signes
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}

          KEYSTORE_PATH: ${{ github.workspace }}/app/release.jks
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

        run: |
          set -euo pipefail

          gradle clean bundleRelease assembleRelease --no-daemon

      # 8. Verifier la signature de l'APK
      - name: Verifier la signature APK
        shell: bash
        run: |
          set -euo pipefail

          APK=$(find app/build/outputs/apk/release \
            -name "*.apk" -type f | head -n 1)

          if [ -z "$APK" ]; then
            echo "::error::APK Release introuvable."
            exit 1
          fi

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" \
            -name apksigner -type f | sort -V | tail -n 1)

          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner introuvable."
            exit 1
          fi

          "$APKSIGNER" verify --verbose --print-certs "$APK"

          echo "APK signe et verifie."

      # 9. Verifier la signature de l'AAB
      - name: Verifier la signature AAB
        shell: bash
        run: |
          set -euo pipefail

          AAB=$(find app/build/outputs/bundle/release \
            -name "*.aab" -type f | head -n 1)

          if [ -z "$AAB" ]; then
            echo "::error::AAB Release introuvable."
            exit 1
          fi

          jarsigner -verify "$AAB"

          echo "AAB signe et verifie."

      # 10. Publier les deux fichiers
      - name: Publier APK et AAB
        uses: actions/upload-artifact@v4
        with:
          name: SamAI-Release-Signed
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14
