
name: Build APK et AAB signes

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android Release
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. RECUPERER LE PROJET
      # ==========================================

      - name: Checkout
        uses: actions/checkout@v4

      # ==========================================
      # 2. INSTALLER JAVA
      # ==========================================

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ==========================================
      # 3. INSTALLER GRADLE
      # ==========================================

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current

      # ==========================================
      # 4. DIAGNOSTIC DES SECRETS
      # ==========================================

      - name: Diagnostic des secrets GitHub
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}

        run: |
          set -euo pipefail

          echo "=========================================="
          echo "       DIAGNOSTIC DES SECRETS SAM AI"
          echo "=========================================="

          check_secret() {
            local name="$1"
            local value="$2"
            local required="$3"

            if [ -n "$value" ]; then
              echo "[OK] $name : PRESENT"
            elif [ "$required" = "yes" ]; then
              echo "[ERREUR] $name : ABSENT"
              return 1
            else
              echo "[INFO] $name : NON CONFIGURE (OPTIONNEL)"
            fi
          }

          ERROR=0

          check_secret KEYSTORE_PASSWORD "${KEYSTORE_PASSWORD:-}" yes || ERROR=1
          check_secret KEY_ALIAS "${KEY_ALIAS:-}" yes || ERROR=1
          check_secret KEY_PASSWORD "${KEY_PASSWORD:-}" yes || ERROR=1

          check_secret OPENAI_API_KEY "${OPENAI_API_KEY:-}" no || ERROR=1
          check_secret GEMINI_API_KEY "${GEMINI_API_KEY:-}" no || ERROR=1
          check_secret YOUTUBE_API_KEY "${YOUTUBE_API_KEY:-}" no || ERROR=1
          check_secret RESEND_API_KEY "${RESEND_API_KEY:-}" no || ERROR=1
          check_secret GOOGLE_CLIENT_SECRET "${GOOGLE_CLIENT_SECRET:-}" no || ERROR=1

          if [ "$ERROR" -ne 0 ]; then
            echo "::error::Un ou plusieurs secrets obligatoires sont absents."
            exit 1
          fi

          echo "Tous les secrets obligatoires sont presents."

      # ==========================================
      # 5. VERIFIER LE FICHIER RELEASE KEY
      # ==========================================

      - name: Verifier le fichier Release Key
        shell: bash
        run: |
          set -euo pipefail

          KEYSTORE="app/release.jks"

          echo "Verification de $KEYSTORE"

          if [ ! -f "$KEYSTORE" ]; then
            echo "::error::Fichier app/release.jks introuvable."
            exit 1
          fi

          if [ ! -s "$KEYSTORE" ]; then
            echo "::error::Le fichier Release Key est vide."
            exit 1
          fi

          echo "[OK] Release Key present."
          echo "Taille : $(stat -c%s "$KEYSTORE") octets"

      # ==========================================
      # 6. VERIFIER MOT DE PASSE ET ALIAS
      # ==========================================

      - name: Diagnostic du Keystore et des alias
        shell: bash
        env:
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}

        run: |
          set -euo pipefail

          KEYSTORE="app/release.jks"

          echo "=========================================="
          echo "VERIFICATION DU MOT DE PASSE KEYSTORE"
          echo "=========================================="

          if ! keytool -list \
            -keystore "$KEYSTORE" \
            -storepass "$STORE_PASSWORD" \
            > "$RUNNER_TEMP/keystore-list.txt" 2>&1; then

            cat "$RUNNER_TEMP/keystore-list.txt"
            echo "::error::KEYSTORE_PASSWORD incorrect ou fichier invalide."
            exit 1
          fi

          echo "[OK] KEYSTORE_PASSWORD valide."

          echo "=========================================="
          echo "ALIASES DISPONIBLES"
          echo "=========================================="

          cat "$RUNNER_TEMP/keystore-list.txt"

          echo "=========================================="
          echo "VERIFICATION DE KEY_ALIAS"
          echo "=========================================="

          if ! ENTRY_INFO=$(keytool -list -v \
            -keystore "$KEYSTORE" \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS" 2>&1); then

            echo "$ENTRY_INFO"
            echo "::error::KEY_ALIAS incorrect ou introuvable."
            exit 1
          fi

          echo "$ENTRY_INFO" | grep -E 'Alias name:|Entry type:|SHA256:'

          if ! grep -qi "PrivateKeyEntry" <<< "$ENTRY_INFO"; then
            echo "::error::Cet alias ne contient pas de cle privee."
            exit 1
          fi

          echo "[OK] KEY_ALIAS valide."
          echo "[OK] Entree PrivateKeyEntry confirmee."

      # ==========================================
      # 7. VERIFIER LE MOT DE PASSE DE LA CLE
      # ==========================================

      - name: Verifier KEY_PASSWORD
        shell: bash
        env:
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

        run: |
          set -euo pipefail

          KEYSTORE="app/release.jks"
          CSR="$RUNNER_TEMP/test-release.csr"

          echo "Verification du mot de passe de la cle privee..."

          if keytool -certreq \
            -alias "$KEY_ALIAS" \
            -keystore "$KEYSTORE" \
            -storepass "$STORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -file "$CSR" \
            > "$RUNNER_TEMP/keypass-check.log" 2>&1; then

            echo "[OK] KEY_PASSWORD valide."
            rm -f "$CSR"

          else
            cat "$RUNNER_TEMP/keypass-check.log"
            echo "::error::KEY_PASSWORD incorrect ou cle privee inaccessible."
            exit 1
          fi

      # ==========================================
      # 8. GENERER APK ET AAB
      # ==========================================

      - name: Generer APK et AAB signes
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}

          KEYSTORE_PATH: ${{ github.workspace }}/app/release.jks
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

        run: |
          set -euo pipefail

          echo "Generation APK Release..."
          gradle clean assembleRelease bundleRelease --no-daemon

          echo "APK et AAB generes."

      # ==========================================
      # 9. VERIFIER LA SIGNATURE APK
      # ==========================================

      - name: Verifier la signature APK
        shell: bash
        run: |
          set -euo pipefail

          APK=$(find app/build/outputs/apk/release \
            -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "::error::APK introuvable."
            exit 1
          fi

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" \
            -type f -name apksigner | sort -V | tail -n 1)

          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner introuvable."
            exit 1
          fi

          "$APKSIGNER" verify --verbose --print-certs "$APK"

          echo "[OK] APK signe et verifie."

      # ==========================================
      # 10. VERIFIER LA SIGNATURE AAB
      # ==========================================

      - name: Verifier la signature AAB
        shell: bash
        run: |
          set -euo pipefail

          AAB=$(find app/build/outputs/bundle/release \
            -type f -name "*.aab" | head -n 1)

          if [ -z "$AAB" ]; then
            echo "::error::AAB introuvable."
            exit 1
          fi

          jarsigner -verify "$AAB"

          echo "[OK] AAB signe et verifie."

      # ==========================================
      # 11. PUBLIER APK ET AAB
      # ==========================================

      - name: Publier APK et AAB
        uses: actions/upload-artifact@v4
        with:
          name: SamAI-Release-Signed
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14
 
