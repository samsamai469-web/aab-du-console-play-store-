name: Build AAB et APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current

      - name: Décoder le keystore
        run: echo "$KEYSTORE_BASE64" | base64 -d > release.jks
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Afficher la clé du keystore (diagnostic)
        run: |
          test -s release.jks || { echo "release.jks est vide : secret KEYSTORE_BASE64 manquant"; exit 1; }
          ALIAS=$(keytool -list -keystore release.jks -storepass "$STORE_PASSWORD" 2>&1 | grep -E "PrivateKeyEntry" | head -1 | cut -d, -f1)
          echo "Alias (lettres séparées par des espaces) :"
          echo "$ALIAS" | sed 's/./& /g'
          keytool -list -v -keystore release.jks -storepass "$STORE_PASSWORD" 2>&1 | grep -E "SHA1"
          keytool -exportcert -rfc -alias "$ALIAS" -keystore release.jks -storepass "$STORE_PASSWORD" -file upload_certificate.pem
        env:
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}

      - name: Publier le certificat de la clé d'importation
        uses: actions/upload-artifact@v4
        with:
          name: upload-certificate
          path: upload_certificate.pem

      - name: Générer l'AAB et l'APK
        run: gradle bundleRelease assembleRelease
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          KEYSTORE_PATH: ${{ github.workspace }}/release.jks
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Publier l'AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: app/build/outputs/bundle/release/*.aab

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/*.apk
