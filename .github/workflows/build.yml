name: Build AAB Play Store

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew || true

      - name: Decode keystore
        env:
          KEYSTORE_64: ${{ secrets.KEYSTORE_64 }}
        run: echo "$KEYSTORE_64" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"

      - name: Build release AAB
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/upload-keystore.jks
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: ./gradlew :app:bundleRelease --stacktrace --no-daemon

      - name: Verify signature
        run: |
          if jarsigner -verify -certs -verbose app/build/outputs/bundle/release/app-release.aab | grep -q "Android Debug"; then
            echo "Signé avec la clé debug"; exit 1
          fi

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SAM_AI_PlayStore_Release
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
