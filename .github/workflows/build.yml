      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | tr -d ' \n\r' | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"
          keytool -list -keystore "$RUNNER_TEMP/upload-keystore.jks" -storepass "${{ secrets.KEYSTORE_PASSWORD }}"
