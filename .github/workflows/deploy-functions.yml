name: Déploiement Firebase Cloud Functions (Sam AI)

on:
  workflow_dispatch:
    inputs:
      openai_model:
        description: 'Modèle OpenAI à déployer (par défaut : gpt-4o)'
        required: false
        default: 'gpt-4o'
  push:
    branches:
      - main
    paths:
      - 'functions/**'
      - '.github/workflows/deploy-functions.yml'

jobs:
  deploy_functions:
    name: Déploiement des Cloud Functions sur Firebase
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code source
        uses: actions/checkout@v4

      - name: Configuration de Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: functions/package.json

      - name: Installation des dépendances Functions
        run: |
          cd functions
          npm install

      - name: Vérification de la syntaxe des scripts
        run: |
          node -c functions/index.js

      - name: Configuration du modèle OpenAI sélectionné
        run: |
          MODEL_CHOICE="${{ github.event.inputs.openai_model }}"
          if [ -z "$MODEL_CHOICE" ]; then
            MODEL_CHOICE="gpt-4o"
          fi
          echo "Configuration de OPENAI_MODEL=$MODEL_CHOICE"
          echo "OPENAI_MODEL=$MODEL_CHOICE" > functions/.env

      - name: Déploiement vers Firebase (sam-traduction)
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          # 1. Vérification des identifiants d'authentification Firebase
          if [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "Authentification via Clé de Service Account Google Cloud..."
            echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-sa.json"
            export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json"
            AUTH_PARAM=""
          elif [ -n "$FIREBASE_TOKEN" ]; then
            echo "Authentification via FIREBASE_TOKEN..."
            AUTH_PARAM="--token $FIREBASE_TOKEN"
          else
            echo "❌ ERREUR : Aucun secret Firebase trouvé dans votre dépôt GitHub !"
            echo "Veuillez ajouter dans GitHub (Settings > Secrets and variables > Actions) :"
            echo "  - FIREBASE_SERVICE_ACCOUNT (recommandé : le contenu du fichier JSON de compte de service téléchargé depuis la Console Firebase)"
            echo "  ou"
            echo "  - FIREBASE_TOKEN (obtenu via la CLI Firebase)"
            exit 1
          fi

          # 2. Configuration sécurisée du secret OPENAI_API_KEY dans Firebase Secrets si fourni dans GitHub Secrets
          if [ -n "$OPENAI_API_KEY" ]; then
            echo "Mise à jour sécurisée du secret OPENAI_API_KEY dans Google Cloud / Firebase Secret Manager..."
            printf "%s" "$OPENAI_API_KEY" | npx firebase-tools functions:secrets:set OPENAI_API_KEY --project sam-traduction --force $AUTH_PARAM || true
          fi

          # 3. Déploiement effectif des Cloud Functions v2
          echo "Déploiement des fonctions samAiChat, apiSamAiChat et checkSamAiModel..."
          npx firebase-tools deploy --only functions --project sam-traduction --non-interactive $AUTH_PARAM

          echo "✅ Déploiement des Cloud Functions réussi avec succès !"
